# Nginx default.conf — SEVALOR Suite Reverse Proxy
# Proporciona: SSL, CSP, rate-limiting, reverse proxy
# Topologia: pwa (3000), backend (8000), bot (8080)

# Rate limiting per endpoint
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Seguretat: amagar versió de nginx
server_tokens off;

# Servidor HTTP → redirecció a HTTPS (en producció)
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# Servidor HTTPS principal
server {
    listen 443 ssl http2;
    server_name sevalor.app *.sevalor.app;

    # SSL (certificats Let's Encrypt, muntats a /etc/letsencrypt)
    ssl_certificate /etc/letsencrypt/live/sevalor.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sevalor.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # CSP Headers de seguretat (Spec 022, AGENTS.md §3.3)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self' https://sede.aeat.gob.es; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # PWA: rutes estàtiques
    location / {
        proxy_pass http://pwa:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API
    location /api/v1/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bot Telegram Webhook
    location /telegram/webhook/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://bot:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check públic
    location /health {
        access_log off;
        proxy_pass http://backend:8000/api/v1/health;
        proxy_set_header Host $host;
    }

    # Carpeta de documents/planols
    location /docs/ {
        internal;
        alias /docs/;
    }

    # Carpeta de dades/fotos
    location /data/ {
        internal;
        alias /data/;
    }
}