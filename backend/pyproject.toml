[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".", ".."]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "alembic",
    ".venv",
    "scripts",
    "tests",
    "update_flota.py",
    "update_economia.py",
    "fix_ia.py",
    "fix_ia_annotated.py",
    "patch_*.py",
    "print_*.py",
    "run_test.py",
    "test_client.py",
    "test_endpoints.py",
    "test_minimal_*.py",
    "tests/conftest.py",
    "tests/test_flux_integracio.py",
    "tests/test_phase1_operari_pwa_eval.py",
    "tests/test_phase4_telegram_portal_eval.py",
    "tests/test_residual.py",
    "tests/test_security_rbac.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
