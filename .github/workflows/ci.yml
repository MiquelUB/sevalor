name: CI/CD Pipeline - SEVALOR

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Pytest Suite & Multi-Tenant RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: sevalor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx alembic

      - name: Execute Alembic Migrations
        working-directory: ./backend
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: sevalor
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/sevalor
        run: |
          alembic upgrade head

      - name: Run Pytest Test Suite
        working-directory: ./backend
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: sevalor
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/sevalor
          TESTING: "1"
          SECRET_KEY: "ci_cd_secret_key_for_testing_purposes_only_minimum_length"
        run: |
          pytest tests/ -v --tb=short

  frontend-pwa:
    name: PWA Strict Lint, Crypto Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        working-directory: ./pwa
        run: npm ci

      - name: Run Cryptographic & Logic Tests
        working-directory: ./pwa
        run: |
          node test_crypto.mjs
          node test_phase0_auth.mjs
          node test_phase0_apifetch.mjs
          node test_pwa_logic.mjs

      - name: Next.js Production Build (Strict TypeScript & ESLint)
        working-directory: ./pwa
        run: npm run build
